defaults:
  duration_sec: 30.0
  sample_rate_hz: 100.0
  random_seed: 42
  translation_amplitude:
    x: 0.10
    y: 0.10
    z: 0.06
  frequency_band:
    min: 0.10
    max: 1.0
  sine_frequency_hz: 0.35

profiles:
  static:
    type: static

  sine_x:
    type: sine
    axis: x

  sine_y:
    type: sine
    axis: y

  sine_z:
    type: sine
    axis: z

  sine_xyz:
    type: sine
    axis: xyz

  random_translation_3d:
    type: random_translation_3d
    component_count: 6
    max_translation_norm: 0.10
