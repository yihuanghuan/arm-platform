stages:
  - build

build-verify:
  stage: build
  before_script:
    - echo "=========================================="
    - echo "Starting CI pipeline..."
    - echo "=========================================="
    - echo "System information:"
    - uname -a
    - df -h
    - free -h
    - echo "Docker information:"
    - docker --version
    - docker info || echo "Docker info failed"
    - echo "=========================================="
    - echo "Checking for existing Docker image..."
    - |
      if docker image inspect manipulator:verify >/dev/null 2>&1; then
        echo "Docker image already exists, skipping build"
        SKIP_BUILD=true
      else
        echo "Docker image not found, will build"
        SKIP_BUILD=false
      fi
    - echo "SKIP_BUILD=$SKIP_BUILD"
    - echo "=========================================="
  script:
    - |
      if [ "$SKIP_BUILD" = true ]; then
        echo "Skipping docker build, using existing image"
      else
        echo "=========================================="
        echo "Building docker image..."
        echo "=========================================="
        docker build -f docker/Dockerfile.verify -t manipulator:verify . --progress=plain 2>&1 | tee docker-build.log
        echo "=========================================="
        echo "Docker build completed"
        echo "=========================================="
      fi
    - echo "=========================================="
    - echo "Running docker container..."
    - echo "=========================================="
    - docker run --rm manipulator:verify 2>&1 | tee docker-run.log
    - echo "=========================================="
    - echo "CI pipeline completed successfully!"
    - echo "=========================================="
    - echo "Build artifacts:"
    - ls -la *.log 2>/dev/null || echo "No log files found"
  after_script:
    - echo "=========================================="
    - echo "Pipeline summary:"
    - echo "Build status: $CI_JOB_STATUS"
    - echo "Job duration: $CI_JOB_DURATION"
    - echo "=========================================="
  only:
    - develop
  tags:
    - manipulator
  artifacts:
    when: always
    paths:
      - docker-build.log
      - docker-run.log
    expire_in: 1 week
    reports:
      junit: docker-run.log
